<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4d4a">
<title>Cocktail Pantry</title>
<style>
:root{--bg:#e8efeb;--ink:#162a2d;--muted:#566b6c;--deep:#1e4d4a;--amber:#e0a526;--red:#b3261e;--card:#fff;--line:#c9d6d1;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#cfdad5}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,.display{font-family:Georgia,"Iowan Old Style",serif;font-weight:700}
#app{position:relative;max-width:480px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.15)}
.page{position:absolute;inset:0;display:flex;flex-direction:column}
.page_head{padding:calc(20px + env(safe-area-inset-top)) 16px 8px}
.page_head h1{font-size:30px;letter-spacing:-.5px}
.page_head p{color:var(--muted);font-size:14px}
.scroll{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.pantry_scroll{padding-bottom:100px}
.empty{margin-top:48px;padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.empty strong{display:block;color:var(--ink);font-family:Georgia,serif;font-size:20px;margin-bottom:6px}
.pantry_item{display:flex;align-items:center;min-height:52px;margin-bottom:10px;padding:0 4px 0 16px;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(22,42,45,.12)}
.pantry_item span{flex:1}
.icon_btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.icon_btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.attribution{padding:16px 0 8px;text-align:center;font-size:12px;color:var(--muted)}
.bottom_bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:var(--deep);color:#f4f1e8;z-index:5}
.bar_btn{min-width:56px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;border-radius:14px}
.bar_btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar_main{background:var(--amber);color:var(--ink);min-width:104px;margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:700}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .26s cubic-bezier(.4,0,.2,1),visibility 0s .26s;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
.overlay.open{transform:translateX(0);visibility:visible;transition:transform .26s cubic-bezier(.4,0,.2,1),visibility 0s}
#add_overlay{z-index:10}
#ingredient_overlay{z-index:20}
#drinks_overlay{z-index:10}
#drink_overlay{z-index:20}
.top_bar{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--deep);color:#f4f1e8;position:relative}
.top_bar input{flex:1;min-width:0;height:44px;padding:0 14px;border:0;border-radius:22px;font:inherit;background:#f4f1e8;color:var(--ink)}
.top_bar .title{flex:1;font-family:Georgia,serif;font-weight:700;font-size:18px}
.menu{position:absolute;right:8px;top:calc(56px + env(safe-area-inset-top));z-index:30;min-width:210px;padding:6px;background:var(--card);color:var(--ink);border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.menu[hidden]{display:none}
.menu p{padding:8px 12px 2px;font-size:12px;color:var(--muted)}
.menu button{display:block;width:100%;min-height:44px;padding:0 12px;text-align:left;border-radius:8px}
.menu button[aria-checked="true"]{background:#e3ece8;font-weight:700}
.tab{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:8px;text-align:left;background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(22,42,45,.12);min-height:64px}
.tab img{width:48px;height:48px;object-fit:contain;flex:none}
.tab .grow{flex:1;min-width:0}
.tag{font-size:12px;color:var(--deep);font-weight:700}
.drink_card{display:flex;align-items:stretch;gap:10px;width:100%;margin-bottom:12px;padding:10px;text-align:left;border-radius:var(--radius);box-shadow:0 2px 6px rgba(22,42,45,.16);border:1px solid rgba(22,42,45,.08)}
.drink_card img{width:72px;height:72px;border-radius:8px;object-fit:cover;flex:none;background:#dfe8e4}
.divider{width:1px;background:rgba(22,42,45,.22);flex:none}
.card_body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;min-height:72px}
.card_top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card_name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:#9a6b00;font-size:13px;letter-spacing:1px;flex:none}
.card_info{font-size:13px;color:#2f4546;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card_bottom{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#2f4546}
.pill{padding:2px 9px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700}
.status{padding:32px 16px;text-align:center;color:var(--muted)}
.status button{margin-top:12px;min-height:44px;padding:0 20px;border-radius:22px;background:var(--deep);color:#fff}
.detail_scroll{padding:0 0 110px}
.hero{display:block;width:100%;aspect-ratio:1/1;max-height:340px;object-fit:cover;background:#dfe8e4}
.hero.contain{object-fit:contain;padding:24px;background:#fff}
.detail_body{padding:16px}
.detail_body h2{font-size:28px;line-height:1.15;margin-bottom:6px}
.meta_row{display:flex;gap:16px;align-items:center;margin:10px 0 14px;color:var(--muted);font-size:14px}
.detail_body h3{margin:18px 0 6px;font-size:16px}
.ing_list{list-style:none}
.ing_list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing_list li.missing{color:var(--red);font-weight:700}
.ing_list .have{color:var(--deep)}
.primary_bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.primary_btn{min-height:52px;min-width:220px;padding:0 32px;border-radius:26px;background:var(--deep);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 14px rgba(30,77,74,.4)}
.primary_btn:disabled{background:#8aa09c;box-shadow:none}
.scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,24,26,.55)}
.scrim[hidden]{display:none}
.dialog{width:100%;padding:20px;border-radius:14px;background:var(--card)}
.dialog h2{font-size:20px;margin-bottom:6px}
.dialog p{color:var(--muted);margin-bottom:16px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end}
.dialog .row button{min-height:44px;padding:0 18px;border-radius:22px;font-weight:700}
.btn_cancel{background:#e3ece8}
.btn_danger{background:var(--red);color:#fff}
.toast{position:absolute;left:50%;bottom:96px;z-index:60;max-width:85%;padding:10px 18px;border-radius:22px;background:var(--ink);color:#fff;font-size:14px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.overlay,.overlay.open{transition-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <main class="page" id="pantry_view">
    <header class="page_head">
      <h1>Your pantry</h1>
      <p id="pantry_count"></p>
    </header>
    <div class="scroll pantry_scroll">
      <div id="pantry_list"></div>
      <p class="attribution">Cocktail data and images provided by TheCocktailDB (CC BY 3.0)</p>
    </div>
    <nav class="bottom_bar" aria-label="Main">
      <button class="bar_btn" id="open_add" aria-label="Add ingredients">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>
      </button>
      <button class="bar_btn bar_main" id="open_drinks" aria-label="Show drinks">
        <svg viewBox="0 0 24 24"><path d="M4 4h16l-8 9-8-9zM12 13v7M8 20h8"/></svg><span>Drinks</span>
      </button>
      <button class="bar_btn" id="open_clear" aria-label="Clear pantry">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Clear</span>
      </button>
    </nav>
  </main>

  <section class="overlay" id="add_overlay" aria-label="Add ingredients" aria-hidden="true" inert>
    <div class="top_bar">
      <button class="icon_btn" data-close aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input type="search" id="add_search" placeholder="Search ingredients" aria-label="Search ingredients" autocomplete="off">
      <button class="icon_btn" id="add_menu_btn" aria-label="Filters" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
      <div class="menu" id="add_menu" hidden>
        <p>Sort</p>
        <button role="menuitemradio" data-key="sort" data-value="az" aria-checked="true">A to Z</button>
        <button role="menuitemradio" data-key="sort" data-value="za" aria-checked="false">Z to A</button>
        <p>Show</p>
        <button role="menuitemradio" data-key="owned" data-value="all" aria-checked="true">All ingredients</button>
        <button role="menuitemradio" data-key="owned" data-value="hide" aria-checked="false">Hide ones I have</button>
      </div>
    </div>
    <div class="scroll" id="add_list" aria-live="polite"></div>
  </section>

  <section class="overlay" id="ingredient_overlay" aria-label="Ingredient detail" aria-hidden="true" inert>
    <div class="top_bar">
      <button class="icon_btn" data-close aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="title">Ingredient</span>
    </div>
    <div class="scroll detail_scroll" id="ingredient_body"></div>
    <div class="primary_bar"><button class="primary_btn" id="ingredient_add">Add to pantry</button></div>
  </section>

  <section class="overlay" id="drinks_overlay" aria-label="Drinks" aria-hidden="true" inert>
    <div class="top_bar">
      <button class="icon_btn" data-close aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input type="search" id="drinks_search" placeholder="Search all drinks" aria-label="Search drinks" autocomplete="off">
      <button class="icon_btn" id="drinks_menu_btn" aria-label="Filters" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
      <div class="menu" id="drinks_menu" hidden>
        <p>Sort</p>
        <button role="menuitemradio" data-key="sort" data-value="match" aria-checked="true">Best match</button>
        <button role="menuitemradio" data-key="sort" data-value="missing" aria-checked="false">Fewest missing</button>
        <button role="menuitemradio" data-key="sort" data-value="name" aria-checked="false">Name</button>
        <p>Show</p>
        <button role="menuitemradio" data-key="show" data-value="all" aria-checked="true">All drinks</button>
        <button role="menuitemradio" data-key="show" data-value="full" aria-checked="false">Ready to make</button>
        <p>Type</p>
        <button role="menuitemradio" data-key="type" data-value="all" aria-checked="true">Any</button>
        <button role="menuitemradio" data-key="type" data-value="alcoholic" aria-checked="false">Alcoholic</button>
        <button role="menuitemradio" data-key="type" data-value="non" aria-checked="false">Non alcoholic</button>
      </div>
    </div>
    <div class="scroll" id="drinks_scroll">
      <div id="drinks_status" class="status" role="status"></div>
      <div id="drinks_list"></div>
      <p class="attribution">Cocktail data and images provided by TheCocktailDB (CC BY 3.0)</p>
    </div>
  </section>

  <section class="overlay" id="drink_overlay" aria-label="Drink detail" aria-hidden="true" inert>
    <div class="top_bar">
      <button class="icon_btn" data-close aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="title">Recipe</span>
    </div>
    <div class="scroll detail_scroll" id="drink_body" style="padding-bottom:24px"></div>
  </section>

  <div class="scrim" id="confirm" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm_title" aria-describedby="confirm_text">
      <h2 id="confirm_title">Clear your pantry?</h2>
      <p id="confirm_text">This removes every ingredient you have saved. It can't be undone.</p>
      <div class="row">
        <button class="btn_cancel" id="confirm_no">Keep it</button>
        <button class="btn_danger" id="confirm_yes">Clear pantry</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
const storage_key="pantry_items_v1";
const default_difficulty=3;
const default_prep_time="2–3 mins";
const local_drink_db={};
const api_base="https://www.thecocktaildb.com/api/json/v1/1/";
const image_base="https://www.thecocktaildb.com/images/ingredients/";
const max_lookups=48;
const search_debounce_ms=150;
const endpoints={
  search_by_name:n=>api_base+"search.php?s="+encodeURIComponent(n),
  lookup_by_id:i=>api_base+"lookup.php?i="+encodeURIComponent(i),
  filter_by_ingredient:n=>api_base+"filter.php?i="+encodeURIComponent(n),
  list_all_ingredients:api_base+"list.php?i=list",
  ingredient_info:n=>api_base+"search.php?i="+encodeURIComponent(n)
};
const synonyms={
  "fresh lemon juice":"lemon juice",
  "fresh lime juice":"lime juice",
  "fresh orange juice":"orange juice",
  "sugar syrup":"simple syrup",
  "powdered sugar":"sugar",
  "superfine sugar":"sugar",
  "caster sugar":"sugar",
  "soda water":"club soda",
  "carbonated water":"club soda",
  "sparkling water":"club soda",
  "angostura bitters":"bitters"
};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s==null?"":s).toLowerCase().trim().replace(/\s+/g," ");
const normalize=s=>{const n=clean(s);return synonyms[n]||n};
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);

const fetch_cache=new Map();
function cached_fetch(url){
  if(!fetch_cache.has(url)){
    fetch_cache.set(url,fetch(url).then(r=>{if(!r.ok)throw new Error("http_"+r.status);return r.json()}).catch(e=>{fetch_cache.delete(url);throw e}));
  }
  return fetch_cache.get(url);
}

function load_pantry(){
  try{const v=JSON.parse(localStorage.getItem(storage_key));return Array.isArray(v)?v:[]}catch(e){return[]}
}
function save_pantry(){
  try{localStorage.setItem(storage_key,JSON.stringify(pantry))}catch(e){show_toast("Couldn't save your pantry on this device")}
}
let pantry=load_pantry();
const in_pantry=name=>pantry.some(p=>normalize(p)===normalize(name));
function add_ingredient(name){
  if(in_pantry(name))return false;
  pantry.push(name);
  save_pantry();
  render_pantry();
  return true;
}
function remove_ingredient(name){
  pantry=pantry.filter(p=>normalize(p)!==normalize(name));
  save_pantry();
  render_pantry();
}

let toast_timer;
function show_toast(msg){
  const t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(toast_timer);
  toast_timer=setTimeout(()=>t.classList.remove("show"),2200);
}

const overlay_stack=[];
function open_overlay(el){
  if(overlay_stack.some(o=>o.el===el))return;
  overlay_stack.push({el,opener:document.activeElement});
  el.removeAttribute("inert");
  el.setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>{el.classList.add("open");const b=el.querySelector("[data-close]");if(b)b.focus({preventScroll:true})});
}
function close_top_overlay(){
  const top=overlay_stack.pop();
  if(!top)return;
  top.el.classList.remove("open");
  top.el.setAttribute("aria-hidden","true");
  top.el.setAttribute("inert","");
  top.el.querySelectorAll(".menu").forEach(m=>m.hidden=true);
  if(top.opener&&top.opener.focus)top.opener.focus({preventScroll:true});
}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",close_top_overlay));
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(!$("confirm").hidden){close_confirm();return}
  close_top_overlay();
});
document.addEventListener("error",e=>{if(e.target&&e.target.tagName==="IMG")e.target.style.visibility="hidden"},true);

function bind_menu(btn,menu,state,on_change){
  btn.addEventListener("click",e=>{
    e.stopPropagation();
    const open=menu.hidden;
    menu.hidden=!open;
    btn.setAttribute("aria-expanded",String(open));
  });
  menu.addEventListener("click",e=>{
    const b=e.target.closest("button[data-key]");
    if(!b)return;
    state[b.dataset.key]=b.dataset.value;
    menu.querySelectorAll('button[data-key="'+b.dataset.key+'"]').forEach(x=>x.setAttribute("aria-checked",String(x===b)));
    menu.hidden=true;
    btn.setAttribute("aria-expanded","false");
    on_change();
  });
  document.addEventListener("click",e=>{
    if(!menu.hidden&&!menu.contains(e.target)){menu.hidden=true;btn.setAttribute("aria-expanded","false")}
  });
}

function render_pantry(){
  const list=$("pantry_list");
  $("pantry_count").textContent=pantry.length?pantry.length+(pantry.length===1?" ingredient":" ingredients")+" on your shelf":"Nothing on your shelf yet";
  if(!pantry.length){
    list.innerHTML='<div class="empty"><strong>Your pantry is empty</strong>Tap Add to stock the bottles and mixers you have at home.</div>';
    return;
  }
  list.innerHTML=pantry.map((p,i)=>'<div class="pantry_item"><span>'+esc(p)+'</span><button class="icon_btn" data-remove="'+i+'" aria-label="Remove '+esc(p)+'"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>').join("");
}
$("pantry_list").addEventListener("click",e=>{
  const b=e.target.closest("[data-remove]");
  if(b)remove_ingredient(pantry[Number(b.dataset.remove)]);
});

let all_ingredients=[];
const add_state={sort:"az",owned:"all"};
async function load_ingredients(){
  if(all_ingredients.length)return;
  $("add_list").innerHTML='<div class="status">Loading ingredients…</div>';
  try{
    const d=await cached_fetch(endpoints.list_all_ingredients);
    all_ingredients=(d.drinks||[]).map(x=>x.strIngredient1).filter(Boolean);
    render_ingredients();
  }catch(e){
    $("add_list").innerHTML='<div class="status">Couldn\'t load ingredients. Check your connection.<br><button id="retry_ingredients">Try again</button></div>';
  }
}
function render_ingredients(){
  if(!all_ingredients.length)return;
  const q=clean($("add_search").value);
  let items=all_ingredients.filter(n=>!q||clean(n).includes(q));
  if(add_state.owned==="hide")items=items.filter(n=>!in_pantry(n));
  items.sort((a,b)=>add_state.sort==="za"?b.localeCompare(a):a.localeCompare(b));
  const total=items.length;
  items=items.slice(0,80);
  if(!items.length){$("add_list").innerHTML='<div class="status">No ingredients match that search.</div>';return}
  $("add_list").innerHTML=items.map(n=>'<button class="tab" data-name="'+esc(n)+'"><img src="'+image_base+encodeURIComponent(n)+'-Small.png" alt="" loading="lazy" width="48" height="48"><span class="grow">'+esc(n)+'</span>'+(in_pantry(n)?'<span class="tag">In pantry</span>':'')+'</button>').join("")+(total>80?'<div class="status">Showing 80 of '+total+'. Keep typing to narrow it down.</div>':'');
}
$("add_list").addEventListener("click",e=>{
  if(e.target.id==="retry_ingredients"){load_ingredients();return}
  const b=e.target.closest(".tab");
  if(b)open_ingredient(b.dataset.name);
});
bind_menu($("add_menu_btn"),$("add_menu"),add_state,render_ingredients);
$("add_search").addEventListener("input",debounce(render_ingredients,search_debounce_ms));

let current_ingredient="";
async function open_ingredient(name){
  current_ingredient=name;
  const body=$("ingredient_body");
  body.innerHTML='<img class="hero contain" src="'+image_base+encodeURIComponent(name)+'-Medium.png" alt=""><div class="detail_body"><h2>'+esc(name)+'</h2><p id="ingredient_desc" class="status" style="padding:8px 0;text-align:left">Loading description…</p></div>';
  sync_ingredient_button();
  open_overlay($("ingredient_overlay"));
  try{
    const d=await cached_fetch(endpoints.ingredient_info(name));
    if(current_ingredient!==name)return;
    const info=d.ingredients&&d.ingredients[0];
    const text=info&&info.strDescription?info.strDescription.trim():"";
    const el=$("ingredient_desc");
    if(el){el.className="";el.style.cssText="";el.textContent=text?(text.length>420?text.slice(0,420).replace(/\s+\S*$/,"")+"…":text):"No description available for this ingredient."}
  }catch(e){
    const el=$("ingredient_desc");
    if(el&&current_ingredient===name)el.textContent="Couldn't load the description right now."
  }
}
function sync_ingredient_button(){
  const b=$("ingredient_add");
  const have=in_pantry(current_ingredient);
  b.disabled=have;
  b.textContent=have?"In your pantry":"Add to pantry";
}
$("ingredient_add").addEventListener("click",()=>{
  if(add_ingredient(current_ingredient)){
    show_toast(current_ingredient+" added");
    sync_ingredient_button();
    render_ingredients();
    close_top_overlay();
  }
});

const pool=new Map();
let current_drinks=[];
let drinks_token=0;
const drinks_state={sort:"match",show:"all",type:"all"};

function get_ingredients(d){
  const out=[];
  for(let i=1;i<=15;i++){
    const n=d["strIngredient"+i];
    if(n&&String(n).trim())out.push({name:String(n).trim(),measure:String(d["strMeasure"+i]||"").trim(),key:normalize(n)});
  }
  return out;
}
function score_drink(d){
  const keys=new Set(pantry.map(normalize));
  const ings=get_ingredients(d);
  const total_ingredients=ings.length;
  const match_count=ings.filter(x=>keys.has(x.key)).length;
  const missing_count=total_ingredients-match_count;
  const match_score=total_ingredients?match_count/total_ingredients:0;
  return{ings,total_ingredients,match_count,missing_count,match_score};
}
const get_difficulty=id=>(local_drink_db[id]&&local_drink_db[id].difficulty)||default_difficulty;
const get_prep_time=id=>(local_drink_db[id]&&local_drink_db[id].prep_time)||default_prep_time;

async function load_drink(id){
  if(pool.has(id))return;
  try{
    const d=await cached_fetch(endpoints.lookup_by_id(id));
    if(d.drinks&&d.drinks[0])pool.set(id,d.drinks[0]);
  }catch(e){}
}
async function refresh_drinks(){
  const token=++drinks_token;
  const q=$("drinks_search").value.trim();
  const status=$("drinks_status");
  if(!q&&!pantry.length){
    current_drinks=[];
    $("drinks_list").innerHTML="";
    status.innerHTML="Add a few ingredients to your pantry and the drinks you can make will show up here.";
    return;
  }
  if(!current_drinks.length){status.textContent="Mixing options…";$("drinks_list").innerHTML=""}
  try{
    let drinks=[];
    if(q){
      const d=await cached_fetch(endpoints.search_by_name(q));
      drinks=Array.isArray(d.drinks)?d.drinks:[];
      drinks.forEach(x=>pool.set(x.idDrink,x));
    }else{
      const lists=await Promise.all(pantry.map(n=>cached_fetch(endpoints.filter_by_ingredient(n)).then(d=>Array.isArray(d.drinks)?d.drinks:[]).catch(()=>[])));
      const counts=new Map();
      lists.forEach(l=>l.forEach(x=>counts.set(x.idDrink,(counts.get(x.idDrink)||0)+1)));
      const ids=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,max_lookups).map(e=>e[0]);
      await Promise.all(ids.map(load_drink));
      drinks=ids.map(id=>pool.get(id)).filter(Boolean);
    }
    if(token!==drinks_token)return;
    current_drinks=drinks;
    render_drinks();
  }catch(e){
    if(token!==drinks_token)return;
    $("drinks_list").innerHTML="";
    status.innerHTML='Couldn\'t reach TheCocktailDB. Check your connection.<br><button id="retry_drinks">Try again</button>';
  }
}
function render_drinks(){
  const status=$("drinks_status");
  let rows=current_drinks.map(d=>({d,s:score_drink(d)}));
  if(drinks_state.show==="full")rows=rows.filter(r=>r.s.missing_count===0);
  if(drinks_state.type==="alcoholic")rows=rows.filter(r=>r.d.strAlcoholic==="Alcoholic");
  if(drinks_state.type==="non")rows=rows.filter(r=>/non/i.test(r.d.strAlcoholic||""));
  const by_name=(a,b)=>a.d.strDrink.localeCompare(b.d.strDrink);
  rows.sort((a,b)=>{
    if(drinks_state.sort==="name")return by_name(a,b);
    if(drinks_state.sort==="missing")return a.s.missing_count-b.s.missing_count||b.s.match_score-a.s.match_score||by_name(a,b);
    return b.s.match_score-a.s.match_score||a.s.missing_count-b.s.missing_count||by_name(a,b);
  });
  if(!rows.length){
    $("drinks_list").innerHTML="";
    status.textContent=current_drinks.length?"No drinks fit these filters.":"No drinks found. Try adding more ingredients or another search.";
    return;
  }
  status.textContent="";
  $("drinks_list").innerHTML=rows.map(({d,s})=>{
    const a=(0.15+s.match_score*0.65).toFixed(2);
    const bg="linear-gradient(rgba(126,191,120,"+a+"),rgba(126,191,120,"+a+")),#fff";
    const info=s.total_ingredients+" ingredients"+(d.strAlcoholic?", "+d.strAlcoholic.toLowerCase():"");
    const diff=get_difficulty(d.idDrink);
    return '<button class="drink_card" data-id="'+esc(d.idDrink)+'" style="background:'+bg+'"><img src="'+esc(d.strDrinkThumb)+'/preview" alt="" loading="lazy" width="72" height="72"><span class="divider"></span><span class="card_body"><span class="card_top"><span class="card_name">'+esc(d.strDrink)+'</span><span class="stars" role="img" aria-label="Difficulty '+diff+' out of 5">'+stars(diff)+'</span></span><span class="card_info">'+esc(info)+'</span><span class="card_bottom"><span>'+esc(get_prep_time(d.idDrink))+'</span>'+(s.missing_count>0?'<span class="pill">'+s.missing_count+' missing</span>':'<span class="tag">Ready to make</span>')+'</span></span></button>';
  }).join("");
}
$("drinks_scroll").addEventListener("click",e=>{
  if(e.target.id==="retry_drinks"){refresh_drinks();return}
  const b=e.target.closest(".drink_card");
  if(b)open_drink(b.dataset.id);
});
bind_menu($("drinks_menu_btn"),$("drinks_menu"),drinks_state,render_drinks);
$("drinks_search").addEventListener("input",debounce(refresh_drinks,search_debounce_ms));

function open_drink(id){
  const d=pool.get(id);
  if(!d)return;
  const s=score_drink(d);
  const diff=get_difficulty(id);
  const history=(d.strCategory||"Cocktail")+(d.strAlcoholic?", "+d.strAlcoholic.toLowerCase():"")+". Served up from TheCocktailDB's collection of classic and modern recipes.";
  $("drink_body").innerHTML='<img class="hero" src="'+esc(d.strDrinkThumb)+'" alt="'+esc(d.strDrink)+'"><div class="detail_body"><h2>'+esc(d.strDrink)+'</h2><p>'+esc(history)+'</p><div class="meta_row"><span class="stars" style="font-size:18px" role="img" aria-label="Difficulty '+diff+' out of 5">'+stars(diff)+'</span><span>'+esc(get_prep_time(id))+'</span></div><h3>Ingredients</h3><ul class="ing_list">'+s.ings.map(x=>{
    const have=in_pantry(x.name);
    return '<li class="'+(have?"":"missing")+'"><span>'+esc(x.name)+(have?"":" (missing)")+'</span><span class="'+(have?"have":"")+'">'+esc(x.measure)+'</span></li>';
  }).join("")+'</ul><h3>Instructions</h3><p>'+esc(d.strInstructions||"No instructions provided.")+'</p><p class="attribution">Cocktail data and images provided by TheCocktailDB (CC BY 3.0)</p></div>';
  $("drink_body").scrollTop=0;
  open_overlay($("drink_overlay"));
}

function open_confirm(){
  if(!pantry.length){show_toast("Your pantry is already empty");return}
  $("confirm").hidden=false;
  $("confirm_no").focus();
}
function close_confirm(){
  $("confirm").hidden=true;
  $("open_clear").focus();
}
$("open_clear").addEventListener("click",open_confirm);
$("confirm_no").addEventListener("click",close_confirm);
$("confirm_yes").addEventListener("click",()=>{
  try{localStorage.removeItem(storage_key)}catch(e){}
  pantry=[];
  render_pantry();
  current_drinks=[];
  $("confirm").hidden=true;
  $("open_add").focus();
  show_toast("Pantry cleared");
});
$("confirm").addEventListener("click",e=>{if(e.target===$("confirm"))close_confirm()});

$("open_add").addEventListener("click",()=>{
  open_overlay($("add_overlay"));
  load_ingredients().then(render_ingredients);
});
$("open_drinks").addEventListener("click",()=>{
  open_overlay($("drinks_overlay"));
  refresh_drinks();
});

render_pantry();
</script>
</body>
</html>
